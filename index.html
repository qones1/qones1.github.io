function detectInitialLang() {
    try {
        const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || navigator.userLanguage || ''];
        for (let i = 0; i < langs.length; i++) {
            const code = String(langs[i] || '').toLowerCase();
            if (!code) continue;
            if (code.startsWith('ru')) return 'ru';
            return 'en';
        }
    } catch (e) {}
    return 'en';
}

function bindLinkFlash() {
    linksContentEl.querySelectorAll('a').forEach(a => {

            this.classList.add('flash-link');

    let html = '';

function updateLangUI(lang, animate) {

    if (!animate) {
        renderLinks(currentLang);

    linksContentEl.classList.add('switching');
    setTimeout(() => {
        renderLinks(currentLang);
        requestAnimationFrame(() => {
            linksContentEl.classList.remove('switching');

function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        return null;
    }
    return s;
}
function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);

}

const vertSrc = `#version 300 es
in vec2 a_position;
out vec2 v_uv;
void main(){
    v_uv = a_position * 0.5 + 0.5;

function getFragSrc(themeIdx) {
    let blobC, glowC1, glowC2, starC, baseC, powC, flareTint;

    if (themeIdx === 0) {
        blobC = `vec3[](vec3(0.98,0.42,0.06),vec3(0.72,0.10,0.82),vec3(0.90,0.22,0.14),vec3(0.42,0.06,0.65))`;

    } else if (themeIdx === 1) {

        glowC1 = `vec3(0.12,0.44,0.96)`;
        glowC2 = `vec3(0.20,0.32,0.82)`;
        starC = `vec3(0.68,0.85,1.0)`;
        baseC = `vec3(0.006,0.010,0.022)`;
        powC = `vec3(1.0,0.98,0.95)`;

    } else {
        blobC = `vec3[](vec3(0.98,0.24,0.04),vec3(0.88,0.12,0.07),vec3(0.82,0.36,0.04),vec3(0.60,0.06,0.04))`;
        glowC1 = `vec3(0.98,0.44,0.08)`;
        glowC2 = `vec3(0.88,0.18,0.05)`;
        starC = `vec3(1.0,0.78,0.55)`;
        baseC = `vec3(0.020,0.006,0.003)`;
        powC = `vec3(0.95,0.92,0.9)`;
        flareTint = `vec3(1.0,0.70,0.55)`;
    }

    return `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;
uniform float u_time;
uniform float u_burst;
uniform vec2 u_resolution;
uniform float u_beat;
uniform float u_bass;
uniform float u_treble;
uniform vec2 u_offset;
uniform float u_motion;
uniform float u_scroll;
uniform int u_tier;
uniform float u_blobT[4];
uniform float u_orbT[6];

float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

const vec3 blobColors[4] = ${blobC};

vec3 scene(vec2 p, float t) {
    vec3 c = ${baseC};

    vec2 pBlobs = p + u_offset * 1.25;
    vec2 pOrbs  = p + u_offset * 1.4375;

    for(int i=0; i<4; i++){

        float dist = length(pBlobs - pos);

        float blob = exp(-dist * dist / (size * size)) * (0.44 + u_bass * 0.18 + u_beat * 0.10);
        c += blobColors[i] * blob;

    for(int i=0; i<6; i++){

            ${glowC2},
            sin(fi * 1.3) * 0.5 + 0.5

    int starCount = (u_tier == 0) ? 12 : 26;
    for(int i=0; i<26; i++){
        if (i >= starCount) break;
        float fi = float(i);
        float dirX = mod(fi, 3.0) - 1.0;

        vec2 starPos = vec2(
            mod(hash(vec2(fi, 0.0)) * 4.0 - 2.0 + (u_time * 0.015 + u_burst * 0.02) * dirX, 4.0) - 2.0,

        float dist = length(pStars - starPos);
        float twinkle = 0.5 + 0.5 * sin(u_time * 2.5 + fi * 4.0 + u_treble * 4.0);

        float glow = exp(-dist * dist / (size * size * 0.18)) * (0.18 + u_treble * 0.30) * twinkle;
        vec3 sc = ${starC};
        c += sc * glow;
    }

    return c;

vec2 evalLensOptics(vec2 nc, vec2 aspectP, vec2 lensOff, vec2 autoDrift, float ringPos) {
    vec2 axis1 = normalize(vec2(-0.75, 0.65) + lensOff * 1.375 + autoDrift);
    vec2 axis2 = normalize(vec2(0.80, -0.60) - lensOff * 1.375 - autoDrift * 0.85);
    vec2 axis3 = normalize(vec2(0.58, 0.81) + vec2(-lensOff.y, lensOff.x) * 1.25 + autoDrift * 0.72);
    vec2 axis4 = normalize(vec2(-0.68, -0.73) - vec2(-lensOff.y, lensOff.x) * 1.15 - autoDrift * 0.64);

    vec2 normDir = normalize(nc + 1e-4);
    float r = length(nc);

    float ang1 = max(0.0, dot(normDir, axis1));
    float ang2 = max(0.0, dot(normDir, axis2));

    float ang4 = max(0.0, dot(normDir, axis4));

    float arc1 = exp(-pow((r - ringPos) * 3.4, 2.0));
    float arc2 = exp(-pow((r - (ringPos - 0.12)) * 2.8, 2.0));
    float arc3 = exp(-pow((r - (ringPos + 0.075)) * 4.6, 2.0));
    float arc4 = exp(-pow((r - (ringPos - 0.24)) * 3.1, 2.0));

    float f1 = pow(ang1, 5.0) * arc1;
    float f2 = pow(ang2, 6.0) * arc2;
    float f3 = pow(ang3, 9.0) * arc3;
    float f4 = pow(ang4, 7.0) * arc4;

    float sweepDist = abs(dot(aspectP, vec2(axis1.y, -axis1.x)) - 0.11 * sin(r * 2.4 - u_time * 0.48));
    float anamorphic = exp(-sweepDist * 14.0) * exp(-pow((r - 0.68) * 2.5, 2.0)) * pow(ang1, 3.0);

    float arcs = f1 * 0.17 + f2 * 0.13 + f3 * 0.11 + f4 * 0.08 + anamorphic * 0.075;

    vec2 ghostAxis = normalize(vec2(-0.72, 0.68) + lensOff * 1.45 + autoDrift * 1.15);
    vec2 perpAxis = vec2(-ghostAxis.y, ghostAxis.x);

    vec2 g1Center = ghostAxis * (0.43 + 0.04 * sin(u_time * 0.52)) + perpAxis * 0.03;
    float g1Dist = length(aspectP - g1Center);
    float g1Ring = exp(-pow((g1Dist - 0.15) * 22.0, 2.0)) * 0.58 + smoothstep(0.16, 0.0, g1Dist) * 0.22;

    vec2 g2Center = -ghostAxis * (0.57 + 0.05 * cos(u_time * 0.44)) - perpAxis * 0.04;
    float g2Dist = length(aspectP - g2Center);
    float g2Ring = exp(-pow((g2Dist - 0.095) * 28.0, 2.0)) * 0.62 + smoothstep(0.10, 0.0, g2Dist) * 0.28;

    vec2 g3Center = -ghostAxis * (0.27 + 0.035 * sin(u_time * 0.64)) + perpAxis * 0.025;
    float g3Dist = length(aspectP - g3Center);
    float g3Disc = exp(-g3Dist * g3Dist / 0.0022) * 0.52 + exp(-pow((g3Dist - 0.052) * 34.0, 2.0)) * 0.36;

    float ghosts = g1Ring * 0.11 + g2Ring * 0.09 + g3Disc * 0.085;
    return vec2(arcs, ghosts);
}

void main(){
    vec2 uv = v_uv;
    vec2 p = uv * 2.0 - 1.0;
    float aspect = u_resolution.x / u_resolution.y;
    p.x *= aspect;

    float r2 = dot(p, p);
    p *= 1.0 + (0.015 + u_bass * 0.02) * r2;

    float t = u_time * 0.09 + u_burst * 0.02;

    vec2 boxDist = abs(uv - 0.5) * 2.0;
    float rectEdge = length(max(boxDist - vec2(0.14 + u_scroll * 0.25), 0.0));
    float circDist = length((uv - 0.5) * vec2(1.65, 1.85));
    float vigMetric = mix(circDist, rectEdge * 1.35, 0.45);

    float vigStart = mix(0.24, 0.62, u_scroll);
    float vigEnd = mix(1.08, 1.58, u_scroll);
    float edgeBlurMask = smoothstep(vigStart, vigEnd, vigMetric);

    float ca = (0.006 + edgeBlurMask * 0.026 + u_bass * 0.012 + u_motion * 0.016) * smoothstep(0.08, 1.2, length(p));
    float blurStr = 0.012 + edgeBlurMask * mix(0.16, 0.10, u_scroll) + u_bass * 0.025 + u_motion * 0.015;

    vec2 ortho = vec2(-p.y, p.x) * edgeBlurMask * 0.045;

    vec3 col = vec3(0.0);
    if (u_tier == 2) {
        vec3 acc = vec3(0.0);
        for(int i=0; i<4; i++){
            float fi = float(i) / 3.0 - 0.5;
            vec2 sp = p * (1.0 - abs(fi) * blurStr) + ortho * fi;
            acc += scene(sp, t);
        }
        col = acc * 0.25;
        vec2 caShift = p * ca;
        col.r = mix(col.r, scene(p + caShift, t).r, 0.78);
        col.b = mix(col.b, scene(p - caShift, t).b, 0.78);
    } else if (u_tier == 1) {
        vec2 sp1 = p * (1.0 - 0.35 * blurStr) - ortho * 0.35;
        vec2 sp2 = p * (1.0 - 0.15 * blurStr) + ortho * 0.35;
        col = (scene(sp1, t) + scene(sp2, t)) * 0.5;
        vec2 caShift = p * ca;
        col.r = mix(col.r, scene(p + caShift, t).r, 0.72);
    } else {
        col = scene(p, t);
    }

    float luma = dot(col, vec3(0.299, 0.587, 0.114));
    float satBoost = mix(0.68, 1.38, u_scroll);
    col = max(vec3(0.0), mix(vec3(luma), col, satBoost));

    float contrastPow = mix(1.12, 1.36, u_scroll);
    float exposureBoost = mix(0.74, 1.32, u_scroll);
    col = pow(max(col, vec3(0.0)), vec3(contrastPow)) * exposureBoost;

    float darkSpread = mix(0.82, 0.40, u_scroll);
    float minBright = mix(0.03, 0.36, u_scroll);
    float softVig = exp(-pow(vigMetric * darkSpread, 2.35));
    softVig = clamp(softVig, minBright, 1.0);
    col *= softVig;

    vec2 lensOffset = u_offset * 0.5625;
    vec2 normC = (uv - 0.5) * 2.0;
    vec2 cleanP = normC;
    cleanP.x *= aspect;

    vec2 autoLensDrift = vec2(
        sin(u_time * 0.42 + u_blobT[0] * 0.16) * 0.13 + cos(u_time * 0.27) * 0.05,
        cos(u_time * 0.36 + u_blobT[1] * 0.16) * 0.13 + sin(u_time * 0.31) * 0.05
    );

    float ringBreath = sin(u_time * 0.62) * 0.032 + u_bass * 0.025;
    float ringPos = mix(0.76, 0.92, u_scroll) + ringBreath;

    float parallaxRatio = clamp(length(u_offset) / 0.175, 0.0, 1.25);
    float flareCA = 0.015 + parallaxRatio * 0.036 + u_motion * 0.024;
    vec2 caDir = normalize(normC + u_offset * 2.4 + 1e-4) * flareCA;

    vec2 optR = evalLensOptics(normC * (1.0 - flareCA * 0.85) + caDir, cleanP * (1.0 - flareCA * 0.85) + caDir * vec2(aspect, 1.0), lensOffset, autoLensDrift, ringPos);
    vec2 optG = evalLensOptics(normC, cleanP, lensOffset, autoLensDrift, ringPos);
    vec2 optB = evalLensOptics(normC * (1.0 + flareCA * 0.85) - caDir, cleanP * (1.0 + flareCA * 0.85) - caDir * vec2(aspect, 1.0), lensOffset, autoLensDrift, ringPos);

    float energyMod = 0.86 + u_bass * 0.42 + u_motion * 0.38 + 0.08 * sin(u_time * 1.1);
    vec3 arcChroma = vec3(optR.x, optG.x, optB.x) * energyMod;
    vec3 ghostChroma = vec3(optR.y, optG.y, optB.y) * (0.82 + u_treble * 0.38 + parallaxRatio * 0.28);

    vec3 opticColor = mix(vec3(0.78, 0.84, 0.94), ${flareTint}, 0.55);
    vec3 ghostTint = mix(${flareTint}, vec3(0.72, 0.90, 1.0), 0.42);
    vec3 spectralWeight = vec3(1.08, 0.97, 1.14);

    col += (arcChroma * opticColor + ghostChroma * ghostTint) * spectralWeight;

    float totalGlint = dot(arcChroma + ghostChroma, vec3(0.333));

    if (u_tier >= 1) {
        vec2 lensUV = cleanP - lensOffset * 0.625 - autoLensDrift * 0.28;
        float polarR = length(lensUV);

        float fineScratches = 0.0;
        if (u_tier == 2) {
            float polarA = atan(lensUV.y, lensUV.x);
            float scratch1 = noise(vec2(polarR * 38.0, polarA * 3.5 + 1.7));
            float scratch2 = noise(vec2(polarR * 72.0 - 4.2, polarA * 1.8));
            fineScratches = smoothstep(0.76, 0.96, scratch1 * scratch2) * smoothstep(0.25, 0.95, polarR);
        }

        vec2 dustGrid = lensUV * 18.0 + vec2(sin(u_time * 0.18), cos(u_time * 0.15)) * 0.35;
        vec2 dustId = floor(dustGrid);
        vec2 dustF = fract(dustGrid) - 0.5;
        float dSeed = hash(dustId);
        vec2 dPos = (vec2(hash(dustId + 2.1), hash(dustId + 5.7)) - 0.5) * 0.6;
        float dDist = length(dustF - dPos);
        float dShift = length(dustF - dPos + caDir * 2.8);
        float microSpecks = smoothstep(0.09, 0.015, dDist) * step(0.86, dSeed) * smoothstep(0.18, 0.85, polarR);
        float microSpecksCA = smoothstep(0.095, 0.015, dShift) * step(0.86, dSeed) * smoothstep(0.18, 0.85, polarR);

        vec2 shardGrid = lensUV * 7.5 + vec2(t * 0.08, -t * 0.06);
        vec2 shardId = floor(shardGrid);
        vec2 shardF = fract(shardGrid) - 0.5;
        float sSeed = hash(shardId + 11.3);
        float shardDist = abs(shardF.x * 0.8 + shardF.y * 0.6) + abs(shardF.x * 0.4 - shardF.y * 0.9) * 0.35;
        vec2 shardFCA = shardF - caDir * 1.9;
        float shardDistCA = abs(shardFCA.x * 0.8 + shardFCA.y * 0.6) + abs(shardFCA.x * 0.4 - shardFCA.y * 0.9) * 0.35;
        float sharpShard = smoothstep(0.085, 0.01, shardDist) * step(0.89, sSeed) * smoothstep(0.32, 1.05, polarR);
        float sharpShardCA = smoothstep(0.09, 0.01, shardDistCA) * step(0.89, sSeed) * smoothstep(0.32, 1.05, polarR);

        float localLight = clamp(luma * 2.3 + totalGlint * 3.5 + 0.14 * u_scroll, 0.0, 1.5);
        float imperfections = (fineScratches * 0.18 + microSpecks * 0.34 + sharpShard * 0.42) * localLight * (0.65 + 0.55 * u_scroll);

        float caBoost = 1.0 + parallaxRatio * 0.55 + u_motion * 0.35;
        vec3 chromaShard = vec3(
            (sharpShardCA * 0.52 + microSpecksCA * 0.30) * caBoost,
            (fineScratches * 0.16 + microSpecks * 0.28 + sharpShard * 0.22) * 0.9,
            (sharpShard * 0.68 + fineScratches * 0.22 + microSpecks * 0.38) * caBoost
        ) * localLight * (0.7 + 0.5 * u_scroll);

        col += mix(chromaShard, ${flareTint} * imperfections, 0.42);
    }

    float grain = (hash(uv * 500.0 + u_time) - 0.5) * (0.015 + u_treble * 0.014);
    col += grain;

    col *= (1.0 + u_bass * 0.09 + u_beat * 0.05);

    col = pow(max(col, vec3(0.0)), ${powC});
    col = col / (1.0 + col * 0.18);

    fragColor = vec4(col, 1.0);
}`;
}

let currentTheme = 0;
const HOURS_12 = 12 * 60 * 60 * 1000;

function getTheme() {
    try {
        const saved = localStorage.getItem('hzzz_theme');
        const lastVisit = localStorage.getItem('hzzz_last_visit');
        const now = Date.now();

        if (lastVisit) {
            const elapsed = now - parseInt(lastVisit);
            if (elapsed > HOURS_12) {
                localStorage.setItem('hzzz_theme', '0');
                localStorage.setItem('hzzz_last_visit', now.toString());
                return 0;
            }
        }

        localStorage.setItem('hzzz_last_visit', now.toString());

        if (saved !== null) {
            const idx = parseInt(saved);
            if (!isNaN(idx) && idx >= 0 && idx <= 2) {
                const next = (idx + 1) % 3;
                localStorage.setItem('hzzz_theme', next.toString());
                return next;
            }
        }

        localStorage.setItem('hzzz_theme', '1');
        return 0;
    } catch(e) {
        return 0;
    }
}

currentTheme = getTheme();

const SEGMENTS_PER_LOOP = 6;
const FULL_LOOP_RAD = Math.PI * 2.0;

const EASING_TEMPLATES = [
    x => 0.28 * x + 0.72 * (x * x * (2.25 - 1.25 * x)),
    x => 0.28 * x + 0.72 * (1.0 - Math.pow(1.0 - x, 2.35)),
    x => 0.22 * x + 0.78 * (0.5 - 0.5 * Math.cos(Math.PI * x)),
    x => x + 0.15 * Math.sin(Math.PI * 2.0 * x),
    x => x - 0.09 * Math.sin(Math.PI * 2.0 * x)
];

function buildSixSegmentSchedule(minDur, maxDur, prevCurve) {
    const segs = [];
    let lastC = prevCurve;
    for (let i = 0; i < SEGMENTS_PER_LOOP; i++) {
        const dur = minDur + Math.random() * (maxDur - minDur);
        let curveIdx = Math.floor(Math.random() * EASING_TEMPLATES.length);
        if (curveIdx === lastC) {
            curveIdx = (curveIdx + 1 + Math.floor(Math.random() * (EASING_TEMPLATES.length - 1))) % EASING_TEMPLATES.length;
        }
        lastC = curveIdx;
        segs.push({ dur, curveIdx });
    }
    return segs;
}

function createSegmentedSphere(initialOffset, minDur, maxDur, dampingSpeed) {
    const startProgress = Math.random();
    const startSeg = Math.floor(startProgress * SEGMENTS_PER_LOOP);
    const schedule = buildSixSegmentSchedule(minDur, maxDur, -1);
    return {
        baseOffset: initialOffset,
        minDur,
        maxDur,
        dampingSpeed,
        cycleCount: 0,
        segIdx: startSeg,
        segElapsed: Math.random() * schedule[startSeg].dur,
        schedule,
        rawCyclePos: startProgress,
        midCyclePos: startProgress,
        smoothCyclePos: startProgress
    };
}

function stepSegmentedSphere(s, dt) {
    s.segElapsed += dt;
    let curSeg = s.schedule[s.segIdx];

    while (s.segElapsed >= curSeg.dur) {
        s.segElapsed -= curSeg.dur;
        s.segIdx++;
        if (s.segIdx >= SEGMENTS_PER_LOOP) {
            s.segIdx = 0;
            s.cycleCount++;
            const lastCurve = s.schedule[SEGMENTS_PER_LOOP - 1].curveIdx;
            s.schedule = buildSixSegmentSchedule(s.minDur, s.maxDur, lastCurve);
        }
        curSeg = s.schedule[s.segIdx];
    }

    const localT = Math.min(Math.max(s.segElapsed / curSeg.dur, 0.0), 1.0);
    const easedLocal = EASING_TEMPLATES[curSeg.curveIdx](localT);

    s.rawCyclePos = s.cycleCount + (s.segIdx + easedLocal) / SEGMENTS_PER_LOOP;

    const alpha1 = 1.0 - Math.exp(-dt * (s.dampingSpeed * 1.35));
    const alpha2 = 1.0 - Math.exp(-dt * s.dampingSpeed);
    s.midCyclePos += (s.rawCyclePos - s.midCyclePos) * alpha1;
    s.smoothCyclePos += (s.midCyclePos - s.smoothCyclePos) * alpha2;

    return s.baseOffset + s.smoothCyclePos * FULL_LOOP_RAD;
}

const blobStates = Array.from({ length: 4 }, (_, i) =>
    createSegmentedSphere(i * 3.927, 1.8, 3.8, 3.2)
);
const orbStates = Array.from({ length: 6 }, (_, i) =>
    createSegmentedSphere(i * 1.047, 1.4, 3.2, 3.6)
);

const blobTUniform = new Float32Array(4);
const orbTUniform = new Float32Array(6);

let burstVel = 0.0;
let burstOffset = 0.0;
let smoothBass = 0.2;
let smoothTreble = 0.2;
let beatImpulse = 0.0;
let lastTickTime = performance.now();

let bgOffsetX = 0, bgOffsetY = 0;
let targetBgX = 0, targetBgY = 0;
let prevBgX = 0, prevBgY = 0;
let motionEnergy = 0;
let smoothScrollP = 0;
let virtualScrollY = 0;
let lastGamma = null, lastBeta = null;

let perfTier = 2;
let avgFrameMs = 16.6;
let slowFrameStreak = 0;
let lastDowngradeTime = 0;

document.addEventListener('visibilitychange', () => {
    slowFrameStreak = 0;
    avgFrameMs = 16.6;
    lastTickTime = performance.now();
});

const MAX_OFFSET = 0.175;
function addParallaxDelta(dx, dy, sens) {
    const currentDist = Math.hypot(targetBgX, targetBgY);
    const ratio = Math.min(1.0, currentDist / MAX_OFFSET);
    const resistance = Math.max(0.03, 1.0 - Math.pow(ratio, 2.2));

    targetBgX += dx * sens * resistance;
    targetBgY += dy * sens * resistance;

    const newDist = Math.hypot(targetBgX, targetBgY);
    if (newDist > MAX_OFFSET) {
        targetBgX = (targetBgX / newDist) * MAX_OFFSET;
        targetBgY = (targetBgY / newDist) * MAX_OFFSET;
    }
}

let bgProg, bgLocs;
function rebuildShader() {
    if (bgProg) {
        gl.deleteProgram(bgProg);
    }
    bgProg = program(vertSrc, getFragSrc(currentTheme));
    bgLocs = {
        a_position: gl.getAttribLocation(bgProg, 'a_position'),
        u_time: gl.getUniformLocation(bgProg, 'u_time'),
        u_burst: gl.getUniformLocation(bgProg, 'u_burst'),
        u_resolution: gl.getUniformLocation(bgProg, 'u_resolution'),
        u_beat: gl.getUniformLocation(bgProg, 'u_beat'),
        u_bass: gl.getUniformLocation(bgProg, 'u_bass'),
        u_treble: gl.getUniformLocation(bgProg, 'u_treble'),
        u_offset: gl.getUniformLocation(bgProg, 'u_offset'),
        u_motion: gl.getUniformLocation(bgProg, 'u_motion'),
        u_scroll: gl.getUniformLocation(bgProg, 'u_scroll'),
        u_tier: gl.getUniformLocation(bgProg, 'u_tier'),
        u_blobT: gl.getUniformLocation(bgProg, 'u_blobT'),
        u_orbT: gl.getUniformLocation(bgProg, 'u_orbT')
    };
}
rebuildShader();

let width, height;

    const w = Math.max(1, Math.floor(window.innerWidth * activeDpr));
    const h = Math.max(1, Math.floor(window.innerHeight * activeDpr));

function onGyro(e) {
    if (e.gamma == null || e.beta == null) return;
    if (lastGamma === null) {
        lastGamma = e.gamma;
        lastBeta = e.beta;
        return;
    }
    const dg = e.gamma - lastGamma;
    const db = e.beta - lastBeta;
    lastGamma = e.gamma;
    lastBeta = e.beta;

    if (Math.abs(dg) > 60 || Math.abs(db) > 60) return;

    addParallaxDelta(dg, -db, 0.0045);
}

if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', onGyro);
}

const SCROLL_DURATION = 3600;
const INTRO_DURATION = 1450;
let pageStart = performance.now();

function strictAcceleratingCurve(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const p = Math.pow(t, 1.45);
    const s = p * p * p * (p * (p * 6.0 - 15.0) + 10.0);
    const decel = 1.0 - Math.pow(1.0 - s, 1.55);
    const creep = t * t * (3.0 - 2.0 * t) * 0.035;
    return creep * (1.0 - decel) + decel;
}

function smoothIntroCurve(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const s = t * t * (3.0 - 2.0 * t);
    return 1.0 - Math.pow(1.0 - s, 2.2);
}

function beginIntro() {
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            setTimeout(() => {
                pageStart = performance.now();
                lastTickTime = pageStart;
                lastDowngradeTime = pageStart;
                overlay.classList.add('hidden');
                scroller.style.scrollSnapType = 'none';
                state.autoStart = pageStart + 120;
                state.autoActive = true;
            }, 60);
        });
    });
}

if (document.fonts && document.fonts.ready) {
    Promise.race([
        document.fonts.ready,
        new Promise(resolve => setTimeout(resolve, 450))
    ]).then(beginIntro);
} else {
    beginIntro();
}

function evaluatePerformance(now, rawMs) {
    if (perfTier <= 0 || document.hidden) return;
    if (now - pageStart < 1800 || now - lastDowngradeTime < 2200) return;
    if (rawMs > 200 || rawMs <= 0) {
        slowFrameStreak = 0;
        return;
    }

    avgFrameMs = avgFrameMs * 0.9 + rawMs * 0.1;

    if (rawMs > 25.5 && avgFrameMs > 24.5) {
        slowFrameStreak++;
        if (slowFrameStreak >= 45) {
            perfTier--;
            slowFrameStreak = 0;
            avgFrameMs = 16.6;
            lastDowngradeTime = now;
            dprScale = perfTier === 1 ? 0.85 : 0.72;
            resize();
        }
    } else if (rawMs < 20.0) {
        slowFrameStreak = Math.max(0, slowFrameStreak - 2);
    }
}

function tick(now) {
    const rawMs = now - lastTickTime;
    const dt = Math.min(Math.max(rawMs * 0.001, 0.001), 0.08);
    lastTickTime = now;
    const time = now * 0.001;

    evaluatePerformance(now, rawMs);

    const slowT = time * 0.8;
    const autoBass = 0.22 + 0.12 * Math.sin(slowT * 1.3) + 0.08 * Math.cos(slowT * 2.1);
    const autoTreble = 0.20 + 0.12 * Math.sin(slowT * 2.4 + 1.2);
    const autoPulse = Math.pow(Math.max(0, Math.sin(slowT * 1.5)), 4.0);

    smoothBass += (autoBass - smoothBass) * 0.08;
    smoothTreble += (autoTreble - smoothTreble) * 0.08;
    beatImpulse = autoPulse * 0.35;
    burstVel = 0.04 + autoPulse * 0.06;

    burstOffset += burstVel * dt;

    for (let i = 0; i < 4; i++) {
        blobTUniform[i] = stepSegmentedSphere(blobStates[i], dt);
    }
    for (let i = 0; i < 6; i++) {
        orbTUniform[i] = stepSegmentedSphere(orbStates[i], dt);
    }

    targetBgX *= Math.exp(-dt * 3.8);
    targetBgY *= Math.exp(-dt * 3.8);
    bgOffsetX += (targetBgX - bgOffsetX) * 0.15;
    bgOffsetY += (targetBgY - bgOffsetY) * 0.15;

    const moveDist = Math.hypot(bgOffsetX - prevBgX, bgOffsetY - prevBgY);
    prevBgX = bgOffsetX;
    prevBgY = bgOffsetY;
    const curSpeed = moveDist / Math.max(dt, 0.001);
    motionEnergy += (curSpeed * 0.6875 - motionEnergy) * 0.2;
    const clampedMotion = Math.min(1.0, motionEnergy);

    const introElapsed = Math.max(0, now - pageStart);
    const introP = Math.min(introElapsed / INTRO_DURATION, 1);
    const introEase = smoothIntroCurve(introP);

    const vh = Math.max(window.innerHeight, 1);
    const targetY = slide2.offsetTop || vh;

    if (state.autoActive && !state.autoDone) {
        if (now >= state.autoStart) {
            const elapsed = now - state.autoStart;
            const progress = Math.min(elapsed / SCROLL_DURATION, 1);
            const eased = strictAcceleratingCurve(progress);
            virtualScrollY = targetY * eased;

            if (progress >= 1) {
                state.autoDone = true;
                virtualScrollY = targetY;
                slide2.style.transform = 'translate3d(0, 0px, 0)';
                scroller.scrollTop = targetY;
                scroller.style.scrollSnapType = 'y mandatory';
                void scroller.offsetHeight;
            } else {
                slide2.style.transform = `translate3d(0, ${-virtualScrollY}px, 0)`;
            }
        } else {
            virtualScrollY = 0;
        }
    } else {
        const domScroll = scroller.scrollTop;
        const smoothAlpha = 1.0 - Math.exp(-dt * 28.0);
        virtualScrollY += (domScroll - virtualScrollY) * smoothAlpha;
        if (Math.abs(domScroll - virtualScrollY) < 0.05) {
            virtualScrollY = domScroll;
        }
    }

    const scrollY = virtualScrollY;
    const totalScrollRatio = Math.min(Math.max(scrollY / vh, 0), 1);
    smoothScrollP += (totalScrollRatio - smoothScrollP) * 0.14;

    vignetteOverlay.style.opacity = (1.0 - smoothScrollP * 0.78).toFixed(3);

    const introTextY = (1 - introEase) * 22;
    const introTextBlur = (1 - introEase) * 10;
    const introArrowY = (1 - introEase) * 26;
    const introArrowBlur = (1 - introEase) * 7;

    if (scrollY < vh) {
        const rawP = Math.min(scrollY / (vh * 0.76), 1);
        const p = rawP * rawP * (3.0 - 2.0 * rawP);
        const blur = Math.pow(p, 1.35) * 14;
        const scale = 1 + p * 0.12;
        const opacity = 1 - Math.pow(p, 1.15) * 0.96;
        const tBlur = blur + introTextBlur;
        const tOp = Math.max(0, opacity) * introEase;

        const heroTranslateY = (!state.autoDone ? -scrollY * 0.34 : 0) + introTextY;
        const arrowTranslateY = (!state.autoDone ? -scrollY * 0.44 : 0) + p * 18 + introArrowY;

        heroText.style.filter = tBlur > 0.04 ? `blur(${tBlur.toFixed(2)}px)` : 'blur(0px)';
        heroText.style.transform = `translate3d(0, ${heroTranslateY.toFixed(2)}px, 0) scale3d(${(scale * 1.08).toFixed(4)}, ${scale.toFixed(4)}, 1)`;
        heroText.style.opacity = tOp.toFixed(4);

        const aBlur = blur * 0.85 + introArrowBlur;
        const aOp = Math.max(0, opacity) * 0.45 * introEase;

        heroArrowWrap.style.filter = aBlur > 0.04 ? `blur(${aBlur.toFixed(2)}px)` : 'blur(0px)';
        heroArrowWrap.style.transform = `translate3d(0, ${arrowTranslateY.toFixed(2)}px, 0) scale3d(${scale.toFixed(4)}, ${scale.toFixed(4)}, 1)`;
        heroArrowWrap.style.opacity = aOp.toFixed(4);
    } else {
        heroText.style.filter = 'blur(14px)';
        heroText.style.transform = 'translate3d(0, 0px, 0) scale3d(1.2096, 1.12, 1)';
        heroText.style.opacity = '0';

        heroArrowWrap.style.filter = 'blur(10px)';
        heroArrowWrap.style.transform = 'translate3d(0, 20px, 0) scale3d(1.1, 1.1, 1)';
        heroArrowWrap.style.opacity = '0';
    }

    const slide2Progress = Math.max(0, (scrollY - vh * 0.22) / (vh * 0.78));
    const rawP2 = Math.min(slide2Progress, 1);
    const p2 = rawP2 * rawP2 * (3.0 - 2.0 * rawP2);
    const blur2 = (1 - p2) * 12;
    const scale2 = 0.88 + p2 * 0.12;
    const opacity2 = p2;

    linksText.style.filter = blur2 > 0.04 ? `blur(${blur2.toFixed(2)}px)` : 'blur(0px)';
    linksText.style.transform = `translate3d(0, 0px, 0) scale3d(${scale2.toFixed(4)}, ${scale2.toFixed(4)}, 1)`;
    linksText.style.opacity = opacity2.toFixed(4);

    bottomText.style.transform = `translate3d(-50%, 0, 0)`;
    bottomText.style.opacity = 0.40;

    gl.viewport(0, 0, width, height);
    const clearColors = [
        [0.010, 0.004, 0.008],
        [0.005, 0.008, 0.016],
        [0.014, 0.004, 0.002]
    ];
    const cc = clearColors[currentTheme];
    gl.clearColor(cc[0], cc[1], cc[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(bgProg);
    gl.uniform1f(bgLocs.u_time, time);
    gl.uniform1f(bgLocs.u_burst, burstOffset);
    gl.uniform2f(bgLocs.u_resolution, width, height);
    gl.uniform1f(bgLocs.u_beat, beatImpulse);
    gl.uniform1f(bgLocs.u_bass, smoothBass);
    gl.uniform1f(bgLocs.u_treble, smoothTreble);
    gl.uniform2f(bgLocs.u_offset, bgOffsetX, bgOffsetY);
    gl.uniform1f(bgLocs.u_motion, clampedMotion);
    gl.uniform1f(bgLocs.u_scroll, smoothScrollP);
    gl.uniform1i(bgLocs.u_tier, perfTier);
    gl.uniform1fv(bgLocs.u_blobT, blobTUniform);
    gl.uniform1fv(bgLocs.u_orbT, orbTUniform);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    requestAnimationFrame(tick);
}

requestAnimationFrame(tick);

function getTextParent(el) {
    if (el.closest('.lang-switch')) return null;
    return el.closest('.hero-text, .arrow-down, .links-block, .bottom-text');
}

let lastTapTime = 0;
let lastTapEl = null;

document.addEventListener('touchend', e => {
    if (e.target.closest('.lang-switch')) return;
    const now = Date.now();
    const textEl = getTextParent(e.target);
    const actingEl = textEl || e.target;
    if (now - lastTapTime < 350 && lastTapEl === actingEl) {
        if (textEl) {
            textEl.classList.remove('flash-text');
            void textEl.offsetWidth;
            textEl.classList.add('flash-text');
            setTimeout(() => textEl.classList.remove('flash-text'), 1000);
        } else {
            canvas.classList.remove('flash-bg');
            void canvas.offsetWidth;
            canvas.classList.add('flash-bg');
            setTimeout(() => canvas.classList.remove('flash-bg'), 1000);
        }
    }
    lastTapTime = now;
    lastTapEl = actingEl;
}, {passive: true});

document.addEventListener('dblclick', e => {
    if (e.target.closest('.lang-switch')) return;
    const textEl = getTextParent(e.target);
    if (textEl) {
        textEl.classList.remove('flash-text');
        void textEl.offsetWidth;
        textEl.classList.add('flash-text');
        setTimeout(() => textEl.classList.remove('flash-text'), 1000);
    } else {
        canvas.classList.remove('flash-bg');
        void canvas.offsetWidth;
        canvas.classList.add('flash-bg');
        setTimeout(() => canvas.classList.remove('flash-bg'), 1000);
    }
});
</script>
